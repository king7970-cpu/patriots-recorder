name: Record Channel 14
run-name: ${{ inputs.show || 'scheduler' }}

on:
  schedule:
    # Backup only: restarts the scheduler if its chain ever breaks. (GitHub cron is unreliable —
    # it skipped/delayed runs by hours — so the scheduler itself does the timing.)
    - cron: "17 3 * * *"
    - cron: "47 9 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      show:
        description: "scheduler, or a show to record now: noon, news, patriots, election"
        type: choice
        options: [scheduler, noon, news, patriots, election]
        default: scheduler
      minutes:
        description: "Test: record N minutes right now (empty = the show's real airtime)"
        required: false
        default: ""
      part_minutes:
        description: "Length of each part in minutes"
        required: false
        default: "30"
      dry_run:
        description: "Test without uploading to Drive"
        type: boolean
        default: false
      since:
        description: "Internal: scheduler hand-over state"
        required: false
        default: ""
      relay:
        description: "Internal (legacy)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  scheduler:
    if: github.event_name == 'schedule' || inputs.show == 'scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Schedule recordings
        env:
          SHOW_ID: scheduler
          SINCE: ${{ inputs.since }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 record.py

      # GitHub pauses cron triggers after 60 days without commits — one commit a day keeps them alive.
      - name: Keep-alive
        if: always()
        run: |
          date -u +"%Y-%m-%d" > last-run.txt
          git config user.name "patriots-recorder"
          git config user.email "actions@users.noreply.github.com"
          git add last-run.txt
          git commit -qm "last run" && (git pull -q --rebase; git push -q) || true

  record:
    if: github.event_name == 'workflow_dispatch' && inputs.show != 'scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null

      - name: Record and upload
        env:
          SHOW_ID: ${{ inputs.show }}
          RECORD_MINUTES: ${{ inputs.minutes }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PART_MINUTES: ${{ inputs.part_minutes || '30' }}
          QUALITY: ${{ vars.QUALITY || '1' }}
          KEEP_DAYS: ${{ vars.KEEP_DAYS || '3' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_USE_TRASH: "false"
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: python3 record.py
